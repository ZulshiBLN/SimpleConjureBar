# Sends the checked artifact "release" from build.yml to the three channels,
# one independent job each: a red one is re-run alone ("Re-run failed jobs"),
# the others are not repeated. Nothing here builds or checks the package.
#
# CI calls this with dry_run on every push - the rehearsal of the whole chain
# before any tag. The release workflow calls it for real; a published release
# cannot be called back (ruleset: releasing.md).
name: Publish

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: true
    # Passed by release.yml's publish job only. GitHub resolves an environment secret in a
    # called workflow only when the caller passes it by name; the jobs below that read them
    # name the environment "release", which only v* tag runs may use (ruleset plan 2026-10-26-release-hardening). The rehearsal
    # passes none.
    secrets:
      CF_API_TOKEN:
        required: false
      WAGO_API_TOKEN:
        required: false

# Only the github job writes (the release); it keeps the rights its caller gives - write from
# release.yml, read in the CI rehearsal - as a called workflow can lower rights, never raise them.
jobs:
  # Before any channel publishes: both tokens arrived, and CurseForge takes its token and lists
  # a WoW Forever version for the TOC. A failure here stops all three channels; a "filing
  # under" warning is only logged (releasing.md has the check before the tag).
  preflight:
    if: ${{ !inputs.dry_run }}
    environment: release
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # nothing here pushes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Both tokens are there, and CurseForge accepts its token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          [ -n "$WAGO_API_TOKEN" ] || { echo "WAGO_API_TOKEN did not arrive"; exit 1; }
          [ -n "$CF_API_TOKEN" ] || { echo "CF_API_TOKEN did not arrive"; exit 1; }
          bash .github/scripts/upload-curseforge.sh --dry-run dist/*.zip dist/notes.md

  curseforge:
    if: ${{ !inputs.dry_run }}
    needs: preflight
    environment: release
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # nothing here pushes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      # The token is set on this one step only
      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bash .github/scripts/upload-curseforge.sh dist/*.zip dist/notes.md

  # The rehearsal: everything but the upload, without a token - the game version from the TOC
  curseforge-dry:
    if: inputs.dry_run
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # nothing here pushes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Upload to CurseForge - dry run
        run: bash .github/scripts/upload-curseforge.sh --dry-run dist/*.zip dist/notes.md

  wago:
    if: ${{ !inputs.dry_run }}
    needs: preflight
    environment: release
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # nothing here pushes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      # The token is set on this one step only
      - name: Upload to Wago
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: bash .github/scripts/upload-wago.sh dist/*.zip dist/notes.md

  # The rehearsal without a token; Wago's version list is public
  wago-dry:
    if: inputs.dry_run
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # nothing here pushes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Upload to Wago - dry run
        run: bash .github/scripts/upload-wago.sh --dry-run dist/*.zip dist/notes.md

  # After a skipped preflight (the rehearsal) it runs; after a failed one it never does
  github:
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # nothing here pushes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      # A missing artifact stops the download above; the action is pinned to a commit, so that
      # cannot change unnoticed. This step checks what the artifact holds.
      - name: The artifact holds the zip, release.json and the notes
        run: |
          [ "$(ls dist/*.zip | wc -l)" = 1 ] || { ls -la dist; echo "expected one zip"; exit 1; }
          [ -f dist/release.json ] || { echo "no release.json"; exit 1; }
          [ -s dist/notes.md ] || { echo "no release notes"; exit 1; }
          echo "artifact: $(basename dist/*.zip), release.json, notes.md"

      - name: GitHub release - arguments only
        if: inputs.dry_run
        run: |
          tag="v$(grep -m1 -E '^## Version:' SimpleConjureBar/SimpleConjureBar.toc | sed -E 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')"
          echo "would run: gh release create $tag $(ls dist/*.zip) dist/release.json --title $tag --notes-file dist/notes.md --verify-tag"
          echo "dry run - nothing published"

      # The release is public from here on
      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/release.json \
              --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
