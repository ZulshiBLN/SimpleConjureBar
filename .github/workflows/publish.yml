# Sends the checked artifact "release" from build.yml to the three channels,
# one independent job each: a red one is re-run alone ("Re-run failed jobs"),
# the others are not repeated. Nothing here builds or checks the package.
#
# CI calls this with dry_run on every push - the rehearsal of the whole chain
# before any tag. The release workflow calls it for real; a published release
# cannot be called back (ruleset: releasing.md).
name: Publish

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: true
    secrets:
      CF_API_TOKEN:
        required: true
      WAGO_API_TOKEN:
        required: true

jobs:
  curseforge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      # The token is set on this one step only
      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: bash .github/scripts/upload-curseforge.sh $DRY_RUN dist/*.zip dist/notes.md

  wago:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      # The token is set on this one step only
      - name: Upload to Wago
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: bash .github/scripts/upload-wago.sh $DRY_RUN dist/*.zip dist/notes.md

  github:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      # A publish job must stop when the artifact is not there. In the
      # rehearsal, downloading one that does not exist must fail.
      - name: Control - a missing artifact stops the job
        if: inputs.dry_run
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: no-such-artifact
          path: missing
      - name: Control - check that the missing artifact failed
        if: inputs.dry_run
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "downloading a missing artifact did not fail ($OUTCOME)"; exit 1; }
          echo "downloading a missing artifact failed, as it must"

      - name: The artifact holds the zip, release.json and the notes
        run: |
          [ "$(ls dist/*.zip | wc -l)" = 1 ] || { ls -la dist; echo "expected one zip"; exit 1; }
          [ -f dist/release.json ] || { echo "no release.json"; exit 1; }
          [ -s dist/notes.md ] || { echo "no release notes"; exit 1; }
          echo "artifact: $(basename dist/*.zip), release.json, notes.md"

      - name: GitHub release - arguments only
        if: inputs.dry_run
        run: |
          tag="v$(grep -m1 -E '^## Version:' SimpleConjureBar/SimpleConjureBar.toc | sed -E 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')"
          echo "would run: gh release create $tag $(ls dist/*.zip) dist/release.json --title $tag --notes-file dist/notes.md --verify-tag"
          echo "dry run - nothing published"

      # The release is public from here on
      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/release.json \
              --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
